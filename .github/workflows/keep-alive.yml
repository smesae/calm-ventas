name: keep-alive

# Mantiene despierta la base de Supabase para que NO se pause por inactividad
# (el plan gratuito se duerme tras ~7 días sin actividad y la app deja de cargar).
# Corre cada 3 días y también se puede lanzar a mano desde la pestaña Actions.

on:
  schedule:
    - cron: '0 12 */3 * *'   # cada 3 días, 12:00 UTC
  workflow_dispatch: {}       # botón para ejecutarlo manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (cuenta como actividad de base de datos)
        run: |
          URL="https://ypsjydadpejmoyqkeaos.supabase.co/rest/v1/empresas?select=id&limit=1"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlwc2p5ZGFkcGVqbW95cWtlYW9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2NzI0OTgsImV4cCI6MjA5OTI0ODQ5OH0.J5NR5S2_5j-toJMCwL5P7ZaL2UMQHGGT_0vr1CyWRkw"
          code=$(curl -sS -o /dev/null -w "%{http_code}" "$URL" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase respondió HTTP $code"
          # 200 o 401 = la base recibió y procesó la consulta (sigue viva). Solo fallar si no respondió.
          if [ "$code" = "000" ]; then echo "Sin respuesta de Supabase"; exit 1; fi
